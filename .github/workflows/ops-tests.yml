name: Ops MCP Tests

on:
  push:
    branches: [main]
    paths:
      - '.claude/mcp/server-ops.js'
      - '.claude/scripts/test-ops-*.sh'
      - '.claude/scripts/test-harness/**'
      - '.claude/scripts/bootstrap-env.sh'
      - '.github/workflows/ops-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '.claude/mcp/server-ops.js'
      - '.claude/scripts/test-ops-*.sh'
      - '.claude/scripts/test-harness/**'
      - '.claude/scripts/bootstrap-env.sh'
      - '.github/workflows/ops-tests.yml'

jobs:
  syntax-check:
    name: Node.js Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .claude/mcp
          npm install --production

      - name: Syntax check server-ops.js
        run: node --check .claude/mcp/server-ops.js

      - name: Syntax check other MCP servers
        run: |
          for server in .claude/mcp/server-*.js; do
            echo "Checking $server..."
            node --check "$server"
          done

  stage3-tests:
    name: Stage 3 — Unit Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .claude/mcp
          npm install --production

      - name: Run Stage 3 tests
        run: |
          cd .claude/scripts
          bash test-ops-stage3.sh
        env:
          # Redact secrets in CI logs
          ACTIONS_STEP_DEBUG: false

  stage4-tests:
    name: Stage 4 — E2E Behavioral Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .claude/mcp
          npm install --production

      - name: Make shims executable
        run: chmod +x .claude/scripts/test-harness/shims/*

      - name: Run Stage 4 E2E tests
        run: |
          cd .claude/scripts
          bash test-ops-stage4.sh
        env:
          # Redact secrets in CI logs
          ACTIONS_STEP_DEBUG: false
          TEST_HARNESS_FIXTURE_DIR: ${{ github.workspace }}/.claude/scripts/test-harness/fixtures

      - name: Upload test logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            .claude/logs/ops-mcp.log
            /tmp/test-*.log
          retention-days: 7

  bootstrap-tests:
    name: Bootstrap — Environment Scaffolding Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make bootstrap script executable
        run: chmod +x .claude/scripts/bootstrap-env.sh

      - name: Run bootstrap E2E tests
        run: |
          cd .claude/scripts
          bash test-bootstrap-env.sh
        env:
          # Redact secrets in CI logs
          ACTIONS_STEP_DEBUG: false

      - name: Run profile mode tests
        run: |
          cd .claude/scripts
          bash test-profile-mode.sh

      - name: Run LIGHT mode behavior tests
        run: |
          cd .claude/scripts
          bash test-light-behavior.sh

      - name: Verify no .env.local files committed
        run: |
          if git ls-files | grep -q "\.env\.local$"; then
            echo "❌ ERROR: .env.local files found in git"
            git ls-files | grep "\.env\.local$"
            exit 1
          fi
          echo "✅ No .env.local files in git"

  lint:
    name: Optional Lint
    runs-on: ubuntu-latest
    needs: syntax-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for ESLint config
        id: check-eslint
        run: |
          if [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ] || [ -f "package.json" ]; then
            echo "eslint_exists=true" >> $GITHUB_OUTPUT
          else
            echo "eslint_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-eslint.outputs.eslint_exists == 'true'
        run: |
          cd .claude/mcp
          npm install

      - name: Run ESLint
        if: steps.check-eslint.outputs.eslint_exists == 'true'
        run: |
          cd .claude/mcp
          if command -v npx &> /dev/null && npx eslint --version &> /dev/null; then
            npx eslint server-ops.js --max-warnings 10
          else
            echo "ESLint not available, skipping"
          fi

  security-scan:
    name: Security — Secret Redaction Audit
    runs-on: ubuntu-latest
    needs: [stage3-tests, stage4-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Audit redaction patterns
        run: |
          echo "Checking for hardcoded secrets in server-ops.js..."

          # Check for common secret patterns (should NOT exist)
          if grep -E "(password|secret|token|key)\s*=\s*['\"][^'\"]{8,}" .claude/mcp/server-ops.js; then
            echo "⚠️  WARNING: Potential hardcoded secrets found"
            exit 1
          fi

          # Verify redactOutput function exists
          if ! grep -q "function redactOutput" .claude/mcp/server-ops.js; then
            echo "❌ ERROR: redactOutput function not found"
            exit 1
          fi

          echo "✅ No hardcoded secrets found"
          echo "✅ redactOutput function exists"

      - name: Verify test fixtures are fake
        run: |
          echo "Verifying test fixtures contain FAKE markers..."

          for secret_file in .claude/scripts/test-harness/fixtures/secrets/*; do
            if [ -f "$secret_file" ]; then
              if ! grep -q "FAKE" "$secret_file"; then
                echo "❌ ERROR: $secret_file missing FAKE marker"
                exit 1
              fi
            fi
          done

          echo "✅ All test fixtures are marked as FAKE"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [syntax-check, stage3-tests, stage4-tests, bootstrap-tests, lint, security-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Ops MCP Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Syntax Check | ${{ needs.syntax-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stage 3 Tests | ${{ needs.stage3-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stage 4 Tests | ${{ needs.stage4-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bootstrap Tests (includes profile mode) | ${{ needs.bootstrap-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
