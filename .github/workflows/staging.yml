name: Deploy to Portainer
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: extract_tag
        run: echo "::set-output name=tag::${GITHUB_SHA}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            koushamad/kousha.dev:${{ steps.extract_tag.outputs.tag }}
          platforms: linux/amd64,linux/arm64/v8

      - name: Deploy to Portainer
        run: curl -X POST "https://portainer.kousha.dev/api/webhooks/${{ secrets.PORTAINER_WEBHOOK_TOKEN }}?tag=${{ steps.extract_tag.outputs.tag }}"