server {
    listen 80;
    server_name kousha.dev;

    root /usr/share/nginx/html;
    error_page 404 /404/index.html;

    location / {
        try_files $uri $uri/ /404/index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires max;
        log_not_found off;
    }

    location = /404/index.html {
        internal;
    }
}
