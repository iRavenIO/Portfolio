  - key: profile
    type: profile
    path: /profile/
    nav_label: Profile
    content:
      title: Systems & Infrastructure Engineer
      subtitle: Helping teams design reliable platforms, automate delivery, and turn complex systems into clear, maintainable architecture.
      paragraphs:
        - "Systems & Infrastructure / Platform Engineer with a backend engineering background. I build and operate production platforms, from Kubernetes infrastructure and CI/CD workflows to the developer tools engineering teams use to build and run their services. My work spans infrastructure automation, observability, reliability, and distributed systems, with a focus on secure, resilient, and maintainable systems."
        - "I take ownership from design and implementation through production operation and ongoing improvement. I enjoy solving complex technical problems, making architectural decisions, and building tools that help engineering teams work independently. I care about engineering quality and systems that remain reliable as they scale."
      sections:
        - heading: Core Expertise
          items:
            - label: Platform Engineering & Developer Tooling
              description: "Go-based platform tools and CLIs, plugin management, secure execution, reusable automation, and self-service workflows."
            - label: Kubernetes & Application Delivery
              description: "Kubernetes and K3s infrastructure, Helm, GitOps with Argo CD, progressive delivery with Argo Rollouts, and CI/CD with GitLab CI and Jenkins."
            - label: Infrastructure as Code & Secrets
              description: "Infrastructure provisioning with Terraform, configuration management with Puppet, secrets management with HashiCorp Vault, and service discovery with HashiCorp Consul."
            - label: High Availability & Reliability
              description: "Multi-data-centre architectures, request routing, workflow recovery and failover, deployment safety, and production reliability."
            - label: Observability & Production Operations
              description: "Prometheus, Grafana, metrics, logging, dashboards, post-deployment monitoring, and production issue investigation."
            - label: Backend Systems & Architecture
              description: "Go services, APIs, workers, messaging, distributed systems, system design, service boundaries, technical reviews, and engineering standards."
        - heading: Technical Skills
          items:
            - label: Languages & Backend
              description: "Go, Python, PHP, Shell, APIs, gRPC, GraphQL, services, workers, CLIs."
            - label: Containers & Orchestration
              description: "Kubernetes, K3s, Docker, Helm."
            - label: Kubernetes Networking & Storage
              description: "Cilium (Kubernetes networking), Calico (network and firewall controls in existing infrastructure), Flannel (pod networking in personal infrastructure), Longhorn (storage in personal infrastructure)."
            - label: Delivery & Workflows
              description: "Argo CD, Argo Rollouts, Argo Workflows, Argo Events, Temporal, GitLab CI, Jenkins, Harbor, Nexus."
            - label: Infrastructure & Automation
              description: "AWS, private cloud, OpenStack, Terraform, Puppet, HashiCorp Vault, HashiCorp Consul."
            - label: Data & Messaging
              description: "MySQL, PostgreSQL, Redis, RabbitMQ, Kafka, NATS, Cassandra, ClickHouse, Elasticsearch, MongoDB."
            - label: Observability & Reliability
              description: "Prometheus, Grafana, metrics, logging, operational dashboards, readiness checks, rollout safety."
            - label: Architecture
              description: "System design, reliability engineering, automation strategy, modular architecture, domain boundaries, technical review, engineering standards."
        - heading: Work Preferences
          bullets:
            - I take ownership of the systems I work on, from design and delivery through to how they behave in production, and I take responsibility for making them better.
            - I enjoy difficult technical problems and demanding responsibilities, including production platforms, complex delivery workflows, and decisions with long-term consequences.
            - I hold myself to high engineering standards and think about the product as well as the code. I value strong collaboration, clear communication, and careful decisions because they lead to more reliable systems and better outcomes over time.

