  - key: projects
    type: projects
    path: /projects/
    nav_label: Experience
    content:
      sections:
        - heading: "\u25A0 Experience"
          items:
            - title: Adyen
              info: Jul 2023 — Present / Infrastructure Engineer, CI/CD & Platform
              href: https://adyen.com/
              details:
                - "Designed and built adyencli in Go, the CLI and package management platform for AdyenCLI: plugins built with Adyen-provided SDKs in four languages, building and distribution through Adyen's package-management infrastructure, and lifecycle, access controls, and secure execution on Linux and macOS."
                - "The platform operated within Adyen's existing infrastructure, including Kubernetes, Helm, Argo CD, Vault, Consul, and Cilium, alongside Calico-based network and firewall controls between data centres."
                - "Designed the backend architecture of a separate highly available system spanning four geographically distributed data centres, routing requests to suitable, responsive services and designed to stay operational when one or more data centres became unavailable."
                - "Built a highly available, multi-cluster execution solution for Argo Workflows, with one cluster executing each workflow's steps at a time and Kubernetes Leader Election as part of the broader architecture; another cluster with capacity could take over on failure or resource pressure."
                - "Implemented workflow recovery using Argo Workflows node-status offloading, so the new execution owner could rerun a Failed step from the recorded state instead of restarting the entire workflow."
                - "Contributed to a Python self-service automation platform where teams define repository automation as Gherkin scenarios over reusable modules, using NATS, with Prometheus and Grafana monitoring down to individual merge requests and pipelines."
            - title: Studocu
              info: Jul 2022 — Jul 2023 / Senior Software Engineer
              href: https://studocu.com/
              details:
                - Worked on backend performance, crawler accessibility, observability, and production reliability for a high-traffic education platform.
                - Built CI/CD checks for SEO and performance testing to make delivery quality more repeatable.
                - Helped teams identify bottlenecks across application and database layers and translate findings into practical improvements.
            - title: KolayIK
              info: May 2021 — May 2022 / Senior Software Engineer & Backend Team Lead
              href: https://kolayik.com/
              details:
                - "Led backend engineering across HR systems, expense management, data import/export, and queue-based services."
                - "Designed and brought up K3s infrastructure from scratch for a multi-data-centre, high-availability environment, covering cluster deployment and the supporting infrastructure required to operate it."
                - "Applied modular architecture, domain boundaries, TDD, messaging, and AWS services to improve maintainability and operational behaviour."
            - title: Wingie Enuygun Group
              info: May 2020 — Apr 2021 / Senior Software Engineer & Team Lead
              href: https://www.enuygun.com
              details:
                - Led hotel-provider integration work and backend services for provider aggregation, search, caching, and data pipelines.
                - Designed Go/gRPC services for concurrent provider requests and standardised hotel data flows.
                - Improved reliability through testing practices, Elasticsearch tuning, cache strategy, and database migration work.
            - title: Insider
              info: Jun 2019 — Jun 2020 / Senior Software Engineer
              href: https://useinsider.com/
              details:
                - Refactored newsletter and email-delivery systems from legacy structures toward clearer service boundaries.
                - Worked on Go services, messaging, data migration, security remediation, and high-volume marketing infrastructure.
                - Improved maintainability through architecture review, repository-service patterns, and data-flow redesign.
            - title: Bamilo
              info: Aug 2015 — Apr 2019 / Senior Software Engineer & Head of Development
              href: https://bamilo.com/
              details:
                - Built and led engineering work across marketplace operations, seller tooling, warehouse systems, delivery tracking, and inventory services.
                - Owned backend architecture, team growth, data migration, Kafka-based pipelines, and service reliability improvements.
                - Helped turn operational problems into maintainable internal platforms for logistics and marketplace teams.
            - title: Sepehr Mahan Tech
              info: Aug 2012 — Jul 2015 / Senior Software Engineer
              href: https://www.sepehrmahan.com/
              details:
                - Developed organisational workflow, task management, form builder, social network, and mobile API systems.
                - Focused on backend services, process automation, and maintainable application foundations for private and public-sector clients.
        - heading: "\u25A0 Selected Platform & Backend Projects"
          items:
            - title: Pepper.com Platform Work
              info: Image processing & marketplace microservices / Go, Kubernetes, Cloudflare, GraphQL
              href: https://www.pepper.com/
              details:
                - "Built a Go image-processing service capable of processing around 5,000 new images per minute, generating multiple resized variants for delivery across the platform."
                - "Implemented deterministic request routing: Cloudflare middleware derived a routing value from each image ID and the configured scaling limit, so the load-balancing layer consistently routed requests for a given image to the same Kubernetes service under the same routing configuration."
                - "Prevented redundant processing of concurrent duplicate resize requests with singleflight-style request coalescing, so overlapping requests shared work already in progress."
                - "Developed GraphQL flows for deal submission, product listings, and product details."

