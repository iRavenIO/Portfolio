    content:
      sections:
        - heading: "\u25A0 Experience"
          items:
            - title: Adyen
              info: Jul 2023 — Present / Infrastructure Engineer, CI/CD & Platform
              href: https://adyen.com/
              details:
                - Designed and built adyencli, a Go platform CLI with plugin SDKs in four languages and access-controlled plugin execution on Linux.
                - Worked on highly available infrastructure for heavy workloads that keeps running through the loss of an entire data centre.
                - Delivered applications on Kubernetes with Helm, Argo CD, and Argo Rollouts for GitOps and progressive delivery, integrated with GitLab/Jenkins CI and artifact systems.
                - Automated infrastructure and operational workflows with Argo Workflows, Argo Events, and Temporal, and built self-service tooling so teams can operate independently.
                - Used Terraform, HashiCorp Vault, and HashiCorp Consul for infrastructure provisioning, secrets management, and service discovery.
                - Improved observability and deployment hardening with Prometheus and Grafana, and investigated production issues across pipelines, infrastructure, and services.
            - title: Studocu
              info: Jul 2022 — Jul 2023 / Senior Software Engineer
              href: https://studocu.com/
              details:
                - Worked on backend performance, crawler accessibility, observability, and production reliability for a high-traffic education platform.
                - Built CI/CD checks for SEO and performance testing to make delivery quality more repeatable.
                - Helped teams identify bottlenecks across application and database layers and translate findings into practical improvements.
            - title: KolayIK
              info: May 2021 — May 2022 / Senior Software Engineer & Backend Team Lead
              href: https://kolayik.com/
              details:
                - Led backend and platform-oriented work for HR systems, expense management, data import/export, and queue-based services.
                - Applied modular architecture, TDD, Redis/RabbitMQ messaging, AWS services, and Kubernetes where appropriate.
                - Supported team delivery through technical review, design direction, and pragmatic automation.
            - title: Wingie Enuygun Group
              info: May 2020 — Apr 2021 / Senior Software Engineer & Team Lead
              href: https://www.enuygun.com
              details:
                - Led hotel-provider integration work and backend services for provider aggregation, search, caching, and data pipelines.
                - Designed Go/gRPC services for concurrent provider requests and standardised hotel data flows.
                - Improved reliability through testing practices, Elasticsearch tuning, cache strategy, and database migration work.
            - title: Insider
              info: Jun 2019 — Jun 2020 / Senior Software Engineer
              href: https://useinsider.com/
              details:
                - Refactored newsletter and email-delivery systems from legacy structures toward clearer service boundaries.
                - Worked on Go services, messaging, data migration, security remediation, and high-volume marketing infrastructure.
                - Improved maintainability through architecture review, repository-service patterns, and data-flow redesign.
            - title: Bamilo
              info: Aug 2015 — Apr 2019 / Senior Software Engineer & Head of Development
              href: https://bamilo.com/
              details:
                - Built and led engineering work across marketplace operations, seller tooling, warehouse systems, delivery tracking, and inventory services.
                - Owned backend architecture, team growth, data migration, Kafka-based pipelines, and service reliability improvements.
                - Helped turn operational problems into maintainable internal platforms for logistics and marketplace teams.
            - title: Sepehr Mahan Tech
              info: Aug 2012 — Jul 2015 / Senior Software Engineer
              href: https://www.sepehrmahan.com/
              details:
                - Developed organisational workflow, task management, form builder, social network, and mobile API systems.
                - Focused on backend services, process automation, and maintainable application foundations for private and public-sector clients.
        - heading: "\u25A0 Selected Platform & Backend Projects"
          items:
            - title: Pepper.com Platform Work
              info: Marketplace microservices / Go, Kubernetes, Laravel, GraphQL, Redis, Elasticsearch, AWS
              href: https://www.pepper.com/
              details:
                - Contributed to microservice maintenance, product/deal flows, GraphQL features, near-cache behavior, and security-oriented review.
                - Built image-service capabilities and backend improvements for a high-volume deal-community platform.

