  - key: profile
    type: profile
    path: /profile/
    nav_label: Profile
    content:
      title: Systems & Infrastructure Engineer
      subtitle: I build the platforms, delivery pipelines and developer tools that engineering teams run their services on.
      paragraphs:
        - "Systems, infrastructure and platform engineer with a background in backend development. I build and run production platforms: Kubernetes infrastructure, CI/CD workflows, and the developer tools engineering teams use to build and run their own services. Most of my work sits in infrastructure automation, observability and distributed systems, and I pay close attention to keeping those systems secure and maintainable."
        - "I usually own a piece of work from the first design through to production and the improvements that come after it. I like hard technical problems and architectural decisions, and I like building tools that let other teams get things done on their own. Engineering quality matters to me, especially in systems that have to keep working as they grow."
      sections:
        - heading: Core Expertise
          items:
            - label: Platform Engineering & Developer Tooling
              description: "Platform tools and CLIs written in Go, plugin management and secure plugin execution, reusable automation, and self service workflows for engineering teams."
            - label: Kubernetes & Application Delivery
              description: "Kubernetes and K3s infrastructure, Helm, GitOps with Argo CD, progressive delivery with Argo Rollouts, and CI/CD pipelines in GitLab CI and Jenkins."
            - label: Infrastructure as Code & Secrets
              description: "Terraform for provisioning, Puppet for configuration management, HashiCorp Vault for secrets and HashiCorp Consul for service discovery."
            - label: High Availability & Reliability
              description: "Architectures that span several data centres, request routing, workflow failover and recovery, and safe deployments."
            - label: Observability & Production Operations
              description: "Prometheus and Grafana, metrics, logging and dashboards, monitoring after each deployment, and digging into production issues."
            - label: Backend Systems & Architecture
              description: "Go services, APIs, workers and messaging, distributed system design, service boundaries, technical reviews and engineering standards."
        - heading: Technical Skills
          items:
            - label: Languages & Backend
              description: "Go, Python, PHP, Shell, APIs, gRPC, GraphQL, services, workers, CLIs."
            - label: Containers & Orchestration
              description: "Kubernetes, K3s, Docker, Helm."
            - label: Kubernetes Networking & Storage
              description: "Cilium (Kubernetes networking), Calico (network and firewall controls in existing infrastructure), Flannel (pod networking in personal infrastructure), Longhorn (storage in personal infrastructure)."
            - label: Delivery & Workflows
              description: "Argo CD, Argo Rollouts, Argo Workflows, Argo Events, Temporal, GitLab CI, Jenkins, Harbor, Nexus."
            - label: Infrastructure & Automation
              description: "AWS, private cloud, OpenStack, Terraform, Puppet, HashiCorp Vault, HashiCorp Consul."
            - label: Data & Messaging
              description: "MySQL, PostgreSQL, Redis, RabbitMQ, Kafka, NATS, Cassandra, ClickHouse, Elasticsearch, MongoDB."
            - label: Observability & Reliability
              description: "Prometheus, Grafana, metrics, logging, operational dashboards, readiness checks, rollout safety."
            - label: Architecture
              description: "System design, reliability engineering, automation strategy, modular architecture, domain boundaries, technical review, engineering standards."
        - heading: Work Preferences
          bullets:
            - I take ownership of what I build, from the design through to how it behaves in production, and I keep improving it after it ships.
            - "I'm drawn to hard problems and real responsibility: production platforms, complicated delivery workflows, and decisions that will matter for years."
            - I set a high bar for engineering and think about the product, not only the code. Good collaboration and clear communication matter to me, because decisions made carefully and together hold up better over time.

