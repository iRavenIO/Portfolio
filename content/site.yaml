  - key: projects
    type: projects
    path: /projects/
    nav_label: Experience
    content:
      sections:
        - heading: "\u25A0 Experience"
          items:
            - title: Adyen
              info: Jul 2023 to Present / Infrastructure Engineer, CI/CD & Platform
              href: https://adyen.com/
              details:
                - "Designed and built adyencli in Go, Adyen's CLI and plugin management platform. Teams write plugins with SDKs provided by AdyenCLI for four programming languages over gRPC, submit them for building and distribution, and manage their lifecycle, access controls and secure execution on Linux and macOS."
                - "Designed the backend architecture of a highly available system deployed across four geographically distributed data centres. It routes requests to responsive services, handles heavy workloads, and is designed to keep running when one or more data centres become unavailable."
                - "Built a highly available, multi cluster execution and recovery solution for Argo Workflows. Another available cluster can take over a workflow when its execution owner fails or comes under resource pressure, and persisted workflow state with retry handling lets failed steps recover without restarting the whole workflow."
                - "Contributed to a modular, self service automation platform built in Python and integrated into the HA environment. Teams define repository specific automation as Gherkin scenarios over reusable modules. It uses NATS, with Prometheus and Grafana monitoring down to individual merge requests and their pipeline executions."
            - title: Studocu
              info: Jul 2022 to Jul 2023 / Senior Software Engineer
              href: https://studocu.com/
              details:
                - Worked on backend performance, crawler accessibility, observability and production reliability for a high traffic education platform.
                - Built CI/CD checks for SEO and performance testing, so every release was validated the same way.
                - Tracked down bottlenecks in the application and database layers and turned the findings into concrete fixes.
            - title: KolayIK
              info: May 2021 to May 2022 / Senior Software Engineer & Backend Team Lead
              href: https://kolayik.com/
              details:
                - "Led backend engineering for HR systems, expense management, data import and export, and queue based services."
                - "Designed and brought up K3s infrastructure from scratch for a high availability environment across multiple data centres, from cluster deployment to the supporting infrastructure needed to run it."
                - "Used modular architecture, clear domain boundaries, TDD, messaging and AWS services to make the systems easier to maintain and operate."
            - title: Wingie Enuygun Group
              info: May 2020 to Apr 2021 / Senior Software Engineer & Team Lead
              href: https://www.enuygun.com
              details:
                - Led hotel provider integrations and the backend services behind provider aggregation, search, caching and data pipelines.
                - Designed Go and gRPC services for concurrent provider requests and standardised hotel data flows.
                - Improved reliability through testing, Elasticsearch tuning, cache strategy and a database migration.
            - title: Insider
              info: Jun 2019 to Jun 2020 / Senior Software Engineer
              href: https://useinsider.com/
              details:
                - Refactored the newsletter and email delivery systems, moving them from legacy structures to clearer service boundaries.
                - Worked on Go services, messaging, data migration and security remediation in high volume marketing infrastructure.
                - Improved maintainability through architecture reviews, the repository and service pattern, and a redesign of data flows.
            - title: Bamilo
              info: Aug 2015 to Apr 2019 / Senior Software Engineer & Head of Development
              href: https://bamilo.com/
              details:
                - Built and led engineering work across marketplace operations, seller tooling, warehouse systems, delivery tracking, and inventory services.
                - Owned backend architecture, team growth, data migration, Kafka pipelines and service reliability improvements.
                - Helped turn operational problems into maintainable internal platforms for logistics and marketplace teams.
            - title: Sepehr Mahan Tech
              info: Aug 2012 to Jul 2015 / Senior Software Engineer
              href: https://www.sepehrmahan.com/
              details:
                - Developed organisational workflow, task management, form builder, social network, and mobile API systems.
                - Built backend services and application foundations for process automation, delivered to private and public sector clients.
        - heading: "\u25A0 Selected Platform & Backend Projects"
          items:
            - title: Pepper.com Platform Work
              info: Image processing & marketplace microservices / Go, Kubernetes, Cloudflare, GraphQL
              href: https://www.pepper.com/
              details:
                - "Built an image processing service in Go that handled around 5,000 new images per minute, generating several resized variants of each image for delivery across the platform."
                - "Implemented deterministic request routing. Cloudflare middleware derived a routing value from each image ID and the configured scaling limit, so the load balancing layer kept sending requests for a given image to the same Kubernetes service as long as the routing configuration stayed the same."
                - "Stopped concurrent resize requests for the same image from being processed twice. Singleflight style request coalescing let overlapping requests share the work already in progress."
                - "Developed GraphQL flows for deal submission, product listings, and product details."

