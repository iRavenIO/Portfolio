  - key: profile
    type: profile
    path: /profile/
    nav_label: Profile
    content:
      title: Systems & Infrastructure Engineer
      subtitle: Helping teams design reliable platforms, automate delivery, and turn complex systems into clear, maintainable architecture.
      paragraphs:
        - "Systems & Infrastructure / Platform Engineer with a backend engineering background. I build and operate production platforms: Kubernetes-based infrastructure, CI/CD and workflow systems, and the developer tooling teams use to ship and run their services. My work covers infrastructure automation, observability, reliability, and distributed systems, with a focus on building platforms that are secure, resilient, and straightforward to operate."
        - "I take ownership of the systems I work on, from design and implementation through production operation and ongoing improvement. I enjoy hard technical problems and the architectural decisions that come with them, and I build tools that let engineering teams work independently. I hold a high bar for engineering quality and for systems that remain reliable and maintainable as they grow."
      sections:
        - heading: Core Expertise
          items:
            - label: Platform Engineering
              description: Building internal platforms, CLIs, and self-service tooling that make delivery safer and let teams operate independently, including access-controlled plugin execution.
            - label: Kubernetes & Cloud Infrastructure
              description: Kubernetes infrastructure and delivery with Helm, Argo CD, and Argo Rollouts, with Terraform, HashiCorp Vault, and Consul for provisioning, secrets, and service discovery in private cloud environments.
            - label: Backend Systems, especially Go
              description: Designing APIs, services, workers, CLIs, and integration layers with clear boundaries and maintainable code.
            - label: CI/CD & Deployment Automation
              description: Improving pipelines, release workflows, merge-request automation, and artifact handling, and automating workflows with Argo Workflows, Argo Events, and Temporal.
            - label: Observability & Reliability
              description: Prometheus and Grafana, metrics, logs, and readiness checks for production systems, investigating production issues, and highly available systems designed to keep operating through data-centre loss.
            - label: Architecture & System Design
              description: Translating complex requirements into pragmatic service boundaries, data flows, and technical decisions.
            - label: DevOps & Infrastructure Automation
              description: Automating operational tasks with scripts, workflows, infrastructure-as-code, and safe runbooks.
            - label: Technical Leadership & Review
              description: Supporting teams through design discussions, code review, mentoring, and clear technical direction.
        - heading: Work Preferences
          bullets:
            - I take ownership of the systems I work on, from design and delivery through to how they behave in production, and I take responsibility for making them better.
            - I enjoy difficult technical problems and demanding responsibilities, including production platforms, complex delivery workflows, and decisions with long-term consequences.
            - I hold myself to high engineering standards and think about the product as well as the code. I value strong collaboration, clear communication, and careful decisions because they lead to more reliable systems and better outcomes over time.

