fullname: "portfolio"

image:
  repository: harbor-registry.tail02a6d.ts.net/application-images/kousha-dev
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: harbor-registry-secret

home:
  name: portfolio
  replicas: 1
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 100Mi
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 50Mi
  env:
    NODE_ENV: production
  secretEnv:
    - name: PORTFOLIO_ADMIN_EMAIL
      secretKeyRef:
        name: portfolio-secrets
        key: portfolio-admin-email
    - name: PORTFOLIO_ADMIN_PASSWORD
      secretKeyRef:
        name: portfolio-secrets
        key: portfolio-admin-password
    - name: PORTFOLIO_MYSQL_HOST
      secretKeyRef:
        name: portfolio-secrets
        key: mysql-host
    - name: PORTFOLIO_MYSQL_PORT
      secretKeyRef:
        name: portfolio-secrets
        key: mysql-port
    - name: PORTFOLIO_MYSQL_DATABASE
      secretKeyRef:
        name: portfolio-secrets
        key: mysql-database
    - name: PORTFOLIO_MYSQL_USER
      secretKeyRef:
        name: portfolio-secrets
        key: mysql-username
    - name: PORTFOLIO_MYSQL_PASSWORD
      secretKeyRef:
        name: portfolio-secrets
        key: mysql-password
  strategy:
    type: canary
    canary:
      maxSurge: 1
      maxUnavailable: 0

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-k3s-ha00
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  host: kousha.dev
  wwwRedirect: true
  tls:
    enabled: true
    secretName: kousha-dev-tls

externalSecret:
  enabled: true
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  targetName: portfolio-secrets
  data:
    - secretKey: portfolio-admin-email
      remoteRef:
        key: k3s-ha00/portfolio/admin
        property: portfolio_admin_email
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: portfolio-admin-password
      remoteRef:
        key: k3s-ha00/portfolio/admin
        property: portfolio_admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysql-host
      remoteRef:
        key: k3s-ha00/portfolio/mysql
        property: host
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysql-port
      remoteRef:
        key: k3s-ha00/portfolio/mysql
        property: port
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysql-database
      remoteRef:
        key: k3s-ha00/portfolio/mysql
        property: database
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysql-username
      remoteRef:
        key: k3s-ha00/portfolio/mysql
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysql-password
      remoteRef:
        key: k3s-ha00/portfolio/mysql
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysql-admin-username
      remoteRef:
        key: k3s-ha00/portfolio/mysql
        property: admin_username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysql-admin-password
      remoteRef:
        key: k3s-ha00/portfolio/mysql
        property: admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

# GlitchTip (Sentry-compatible) error reporting. Gated OFF by default so a
# not-yet-provisioned Vault property cannot fail-close the ExternalSecret.
# When enabled, the admin-api Node runtime gets the IN-CLUSTER SENTRY_DSN from
# Vault. The browser DSN (NEXT_PUBLIC_SENTRY_DSN) is injected at BUILD time
# (build-arg), never via runtime env, so the internal DSN can never reach the
# client bundle.
glitchtip:
  enabled: false
  ssrDsnProperty: kousha_ssr_dsn_internal

migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 120

logging:
  enabled: true
  app: "portfolio"
  component: "web"
  logClass: "app"
  retentionClass: "standard"
  environment: "production"
