{{- if .Values.glitchtip.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "portfolio.fullname" . }}-glitchtip
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: {{ include "portfolio.fullname" . }}-glitchtip
    creationPolicy: Owner
  data:
    # In-cluster DSN for the admin-api Node runtime
    # (glitchtip.glitchtip.svc.cluster.local:8000).
    - secretKey: SENTRY_DSN
      remoteRef:
        key: k3s-ha00/portfolio/glitchtip
        property: {{ .Values.glitchtip.ssrDsnProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
