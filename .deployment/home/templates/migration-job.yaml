{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "portfolio.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "portfolio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-and-seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/app/services/admin-api/src/migrate-and-seed.js"]
          env:
            - name: PORTFOLIO_MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetName }}
                  key: mysql-host
            - name: PORTFOLIO_MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetName }}
                  key: mysql-port
            - name: PORTFOLIO_MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetName }}
                  key: mysql-database
            - name: PORTFOLIO_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetName }}
                  key: mysql-username
            - name: PORTFOLIO_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetName }}
                  key: mysql-password
            - name: PORTFOLIO_MYSQL_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetName }}
                  key: mysql-admin-username
            - name: PORTFOLIO_MYSQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetName }}
                  key: mysql-admin-password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
{{- end }}
